<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Job Tracker{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="site-header">
        <div class="header-content">
            <a class="brand" href="{{ url_for('dashboard') }}">Job Tracker</a>

            <nav class="main-nav">
                <a href="{{ url_for('dashboard') }}">Dashboard</a>
                <a href="{{ url_for('companies') }}">Companies</a>
                <a href="{{ url_for('jobs') }}">Jobs</a>
                <a href="{{ url_for('applications') }}">Applications</a>
                <a href="{{ url_for('contacts') }}">Contacts</a>
                <a href="{{ url_for('job_match') }}">Job Match</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="flash-message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>Job Tracker &copy; 2026</p>
    </footer>

</body>
</html>
